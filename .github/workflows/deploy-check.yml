name: Deploy check
# Cloudflare builds and deploys main itself (Workers Builds). This proves it
# worked: it waits for Cloudflare's check run on the pushed commit, then
# compares production with this commit's build, file by file. Read-only.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
env:
  SITE: https://deltadeck.net
jobs:
  production-serves-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Wait for Cloudflare's build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages") | {name, status, conclusion}]' \
              || echo '[]')
            if [ "$(echo "$runs" | jq length)" -gt 0 ]; then
              if [ "$(echo "$runs" | jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length')" -gt 0 ]; then
                echo "::error::Cloudflare's build failed: $runs"
                exit 1
              fi
              if [ "$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')" -eq 0 ]; then
                echo "Cloudflare's build succeeded: $runs"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::warning::No finished Cloudflare check run for $SHA after 15 minutes; checking the site itself."
      - name: Production serves this commit
        run: node scripts/verify-deploy.ts --url "$SITE" --wait 900
